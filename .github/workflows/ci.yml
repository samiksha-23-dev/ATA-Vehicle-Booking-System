name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sam123
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create databases
        run: |
          PGPASSWORD=sam123 psql -h localhost -U postgres -c "CREATE DATABASE ata_auth;"
          PGPASSWORD=sam123 psql -h localhost -U postgres -c "CREATE DATABASE ata_admin;"
          PGPASSWORD=sam123 psql -h localhost -U postgres -c "CREATE DATABASE ata_booking;"
          PGPASSWORD=sam123 psql -h localhost -U postgres -c "CREATE DATABASE ata_customer;"

      - name: Build and test
        run: mvn clean test -B
          -Djacoco.skip=false
          -Dpmd.failOnViolation=false
          -Dcpd.failOnViolation=false

      - name: Generate JaCoCo report
        run: mvn jacoco:report -B --fail-at-end || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build
